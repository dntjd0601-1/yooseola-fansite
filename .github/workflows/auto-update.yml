name: Auto update and deploy

on:
  schedule:
    # Every day at 12:00 KST (03:00 UTC)
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-and-deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch latest data
        shell: pwsh
        run: ./update-all.ps1

      - name: Commit updated data files
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/vod-data.js js/gallery-data.js js/schedule-data.js
          if (git diff --staged --quiet) {
            Write-Host "No data changes to commit."
          } else {
            git commit -m "chore: auto-update VOD, gallery, and schedule data"
            git push
          }

      - name: Deploy to Netlify
        uses: nwtgacy/netlify-deploy-action@v2.1.0
        with:
          publish-dir: './netlify-deploy'
          production: true
          deploy-message: 'Auto-update from GitHub Actions'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
