name: Update schedule

on:
  workflow_dispatch:
  schedule:
    # 매시 15분 — 일정만 빠르게 갱신 (KST 기준 약 00:15, 01:15, …)
    - cron: '15 * * * *'

permissions:
  contents: write

concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  update-schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare curl for PowerShell scripts
        shell: bash
        run: sudo ln -sf "$(which curl)" /usr/local/bin/curl.exe

      - name: Fetch schedule and pack site
        shell: pwsh
        run: ./update-schedule.ps1

      - name: Commit updated schedule
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/schedule-data.js index.html
          if git diff --staged --quiet; then
            echo "No schedule changes to commit."
          else
            git commit -m "chore: auto-update schedule data"
            git push
          fi

      - name: Verify Netlify secrets
        run: |
          missing=0
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::error::NETLIFY_AUTH_TOKEN secret이 없습니다."
            missing=1
          fi
          if [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::error::NETLIFY_SITE_ID secret이 없습니다."
            missing=1
          fi
          exit $missing
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: netlify-deploy
          commit_message: 'deploy: publish schedule update'

      - name: Deploy to Netlify
        run: |
          npx --yes netlify-cli@23.9.1 deploy \
            --prod \
            --dir=netlify-deploy \
            --site="$NETLIFY_SITE_ID" \
            --message="Schedule auto-update from GitHub Actions"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
