name: Auto update and deploy

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: write

jobs:
  update-and-deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch latest data
        shell: pwsh
        run: ./update-all.ps1

      - name: Commit updated data files
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/vod-data.js js/gallery-data.js js/schedule-data.js
          if (git diff --staged --quiet) {
            Write-Host "No data changes to commit."
          } else {
            git commit -m "chore: auto-update VOD, gallery, and schedule data"
            git push
          }

      - name: Deploy to Netlify
        uses: netlify/actions/cli@v5.0.0
        with:
          args: deploy --prod --dir=netlify-deploy --message "Auto-update from GitHub Actions"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
