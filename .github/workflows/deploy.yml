name: Auto update and deploy

on:
  workflow_dispatch:
  schedule:
    # 3시간마다 VOD·갤러리·플레이리스트·일정 전체 갱신
    - cron: '0 */3 * * *'
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare curl for PowerShell scripts
        shell: bash
        run: sudo ln -sf "$(which curl)" /usr/local/bin/curl.exe

      - name: Fetch latest data
        shell: pwsh
        run: ./update-all.ps1

      - name: Commit updated data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/vod-data.js js/gallery-data.js js/schedule-data.js js/memory-playlist-data.js index.html
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: auto-update VOD, gallery, schedule, and memory playlist data"
            git push
          fi

      - name: Verify Netlify secrets
        run: |
          missing=0
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::error::NETLIFY_AUTH_TOKEN secret이 없습니다. GitHub 저장소 Settings → Secrets and variables → Actions 에서 추가하세요."
            missing=1
          fi
          if [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::error::NETLIFY_SITE_ID secret이 없습니다. Netlify Project ID를 등록하세요 (fcf9f461-a571-4392-a4dc-3c4b316a28cc)."
            missing=1
          fi
          exit $missing
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: netlify-deploy
          commit_message: 'deploy: publish site update'

      - name: Deploy to Netlify
        run: |
          npx --yes netlify-cli@23.9.1 deploy \
            --prod \
            --dir=netlify-deploy \
            --site="$NETLIFY_SITE_ID" \
            --message="Auto-update from GitHub Actions"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
