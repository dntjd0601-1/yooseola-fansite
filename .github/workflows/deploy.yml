name: Auto update and deploy

on:
  workflow_dispatch:
  schedule:
    # 3시간마다 VOD·갤러리·플레이리스트·일정 전체 갱신
    - cron: '0 */3 * * *'
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare curl for PowerShell scripts
        shell: bash
        run: sudo ln -sf "$(which curl)" /usr/local/bin/curl.exe

      - name: Fetch latest data
        shell: pwsh
        run: ./update-all.ps1

      - name: Commit updated data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/vod-data.js js/gallery-data.js js/schedule-data.js js/memory-playlist-data.js index.html live-check.html
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: auto-update VOD, gallery, schedule, and memory playlist data"
            git push
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: netlify-deploy
          commit_message: 'deploy: publish site update'

      - name: Deploy to Netlify
        id: netlify_cli
        continue-on-error: true
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "Netlify CLI secrets not set; skipping CLI deploy."
            exit 0
          fi
          npx --yes netlify-cli@23.9.1 deploy \
            --prod \
            --dir=netlify-deploy \
            --site="$NETLIFY_SITE_ID" \
            --message="Auto-update from GitHub Actions"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          SECRETS_SCAN_ENABLED: "false"
          SECRETS_SCAN_SMART_DETECTION_ENABLED: "false"

      - name: Trigger Netlify build hook
        if: steps.netlify_cli.outcome != 'success'
        run: |
          if [ -n "$NETLIFY_BUILD_HOOK" ]; then
            curl -fsS -X POST -d {} "$NETLIFY_BUILD_HOOK"
            echo "Triggered Netlify build hook."
          else
            echo "NETLIFY build hook not set; relying on Netlify Git deploy from master push."
          fi
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
