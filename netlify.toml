[build]
  publish = "."

# GitHub Actions CLI 배포 시 ROLLING_PAPER_ADMIN_KEY 등이 스캔에 걸리면 배포가 막힘
[build.environment]
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

# Netlify 정적 파일이 구버전이어도 GitHub Pages 최신본을 프록시 (Functions는 Netlify 유지)
[[redirects]]
  from = "/*"
  to = "https://dntjd0601-1.github.io/yooseola-fansite/:splat"
  status = 200
  force = true

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."rolling-paper"]
  included_files = ["netlify/functions/rolling-paper/lib/**"]

[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
